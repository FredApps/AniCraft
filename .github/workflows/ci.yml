name: CI
on:
  push:
    branches: [diag/778-svg-link-parity]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@ecb64b2acb8731f0e2eb8f55fd2f45424bef75d0
    with:
      os: '["ubuntu-24.04","windows-latest"]'
      timeout-minutes: 25
      gate-timeout-minutes: 23
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      packages: libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev libasound2-dev
      targets: ""
      tools: ""
      cache-name: ani-778-lottie-scoped
      command: |
        set -eu
        git fetch --depth=1 origin 2cd16209af7ed9a59b635c7ffce703d461040e03
        git diff --exit-code 2cd16209af7ed9a59b635c7ffce703d461040e03 HEAD -- . ':(exclude).github/workflows/ci.yml'
        rustfmt --edition 2024 --check crates/engine/src/rich_text_tests.rs
        cargo test --locked -p anicraft-engine --lib svg_links_are_sanitized_and_round_trip_without_changing_the_drawing -- --nocapture
        cargo test --locked -p anicraft-engine --lib rich_text_tests
        cargo clippy --locked -p anicraft-engine --lib --tests -- -D warnings
